<html>

<head>
	<title>Pico httpd example</title>
	<script src="https://unpkg.com/htmx.org@2.0.4"
		integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
		crossorigin="anonymous"></script>
</head>

<body>
	<h1>Pico httpd example</h1>
	<p><!--#adc--></p>
	<a href="/adc.shtml">adc</a>
	<p hx-get="/adc.shtml" hx-trigger="every 1s"></p>
	<p hx-get="/adcjson.shtml" hx-trigger="every 1s"></p>
	<p><!--#adcjson--></p>
</body>

<script>
	let readings = [];
	function fetchAdcJson() {
		fetch('/adcjson.shtml')
			.then(response => response.text())
			.then(data => {
				try {
					const jsonData = JSON.parse(data);
					readings.push(jsonData);
					console.log(jsonData);
				} catch (e) {
					console.log(data);
				}
			});
	}
	setInterval(fetchAdcJson, 1000);
</script>

</html>
